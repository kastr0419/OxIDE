name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # バイナリビルド (Windows + Linux)
  # ─────────────────────────────────────────────
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: alloide.exe
            archive: alloide-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: alloide
            archive: alloide-linux-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libudev-dev pkg-config

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Windows: zip 圧縮
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target\${{ matrix.target }}\release\${{ matrix.artifact }}"
          Compress-Archive -Path $bin, README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE `
            -DestinationPath ${{ matrix.archive }}

      # Linux: tar.gz 圧縮 (バイナリをトップレベルに配置)
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          cp "$BIN" alloide
          tar czf ${{ matrix.archive }} alloide README.md LICENSE-MIT LICENSE-APACHE NOTICE
          rm alloide

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # ─────────────────────────────────────────────
  # GitHub Release 作成 & アップロード
  # ─────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## ALLoIDE ${{ github.ref_name }}

            > Arduino-IDE-style simplicity, for Rust embedded development.

            ### ✅ 実装済みボード
            - Arduino Uno / Nano (AVR)
            - ESP32 (Xtensa)
            - STM32F4xx (ARM Cortex-M4F)

            ### ダウンロード
            - `ALLoIDE_Setup_*.exe` — Windows 64-bit インストーラー (Rust同梱)
            - `alloide-windows-x86_64.zip` — Windows 64-bit ポータブル
            - `alloide-linux-x86_64.tar.gz` — Linux 64-bit

            ### Linux クイックインストール
            ```bash
            curl -sSf https://raw.githubusercontent.com/kastr0419/ALLoIDE/master/installer/install.sh | bash
            ```

            ### ライセンス
            MIT OR Apache-2.0
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*
