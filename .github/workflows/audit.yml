name: Security & License Audit

on:
  schedule:
    - cron: '0 9 * * 1'   # 毎週月曜 09:00 UTC
  workflow_dispatch:        # 手動実行も可能

jobs:
  # ─────────────────────────────────────────────
  # セキュリティ脆弱性スキャン (cargo-audit)
  # ─────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true  # 警告でもワークフロー継続

      - name: Run cargo audit (JSON output)
        run: cargo audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: audit-report.json

  # ─────────────────────────────────────────────
  # ライセンス依存チェック (cargo-license)
  # ─────────────────────────────────────────────
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-license
        run: cargo install cargo-license --locked

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libudev-dev pkg-config

      - name: Generate license report
        run: cargo license --json > license-report.json

      - name: Check for GPL licenses (fail if found)
        run: |
          if cargo license | grep -iE "^GPL|^AGPL"; then
            echo "::error::GPL/AGPL licensed dependency found!"
            exit 1
          else
            echo "No copyleft licenses found. ✅"
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.json

  # ─────────────────────────────────────────────
  # 依存クレートの更新チェック (cargo-outdated)
  # ─────────────────────────────────────────────
  dependency-update:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libudev-dev pkg-config

      - name: Check outdated dependencies
        run: cargo outdated --exit-code 0
        continue-on-error: true
